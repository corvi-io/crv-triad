[project]
name = "crv-triad-api"
version = "0.0.0"
description = "CRV Triad API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.18.4",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "inject>=5.2.1",
  "psycopg[binary]>=3.3.4",
  "pydantic-settings>=2.7.1",
  "sqlmodel>=0.0.38",
  "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-cov>=7.0.0",
  "ruff>=0.8.4",
]

[project.scripts]
crv-triad-api = "entrypoints.rest.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entrypoints", "src/infra", "src/modules"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
