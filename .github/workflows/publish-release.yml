name: Publish Release

on:
  workflow_run:
    workflows: [Production Pipeline]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    if: ${{ vars.CICD__RELEASE_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Verify release token secret
        env:
          CICD__RELEASE_TOKEN: ${{ secrets.CICD__RELEASE_TOKEN }}
        run: |
          if [ -z "$CICD__RELEASE_TOKEN" ]; then
            echo "::error::CICD__RELEASE_TOKEN repository secret is required for release publishing."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CICD__RELEASE_TOKEN }}

      - name: Read release version
        id: version
        run: |
          version="$(node -e "const manifest = require('./.release-please-manifest.json'); process.stdout.write(manifest['.']);")"
          if [ -z "$version" ]; then
            echo "::error::Could not read root release version from .release-please-manifest.json."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = require('./.release-please-manifest.json');
          const version = manifest['.'];
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const headingPattern = new RegExp(`^##\\s+(?:\\[v?${escapedVersion}\\](?:\\([^)]*\\))?|v?${escapedVersion})(?:\\s|$)`, 'm');
          const headingMatch = changelog.match(headingPattern);
          if (!headingMatch || headingMatch.index === undefined) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_notes=false\n');
            console.log(`No release notes section found for ${version} in CHANGELOG.md. Nothing to publish.`);
            process.exit(0);
          }
          const start = headingMatch.index;
          const nextHeadingPattern = /^##\s+/gm;
          nextHeadingPattern.lastIndex = start + headingMatch[0].length;
          const nextHeadingMatch = nextHeadingPattern.exec(changelog);
          const next = nextHeadingMatch?.index ?? -1;
          const notes = changelog.slice(start, next === -1 ? undefined : next).trim();
          fs.writeFileSync('release-notes.md', `${notes}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_notes=true\n');
          NODE

      - name: Create GitHub Release
        if: ${{ steps.notes.outputs.has_notes == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CICD__RELEASE_TOKEN }}
          CICD__TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$CICD__TAG_NAME" >/dev/null 2>&1; then
            echo "Release $CICD__TAG_NAME already exists."
            exit 0
          fi

          gh release create "$CICD__TAG_NAME" \
            --target "$GITHUB_SHA" \
            --title "$CICD__TAG_NAME" \
            --notes-file release-notes.md

      - name: Mark Release Please pull request as tagged
        if: ${{ steps.notes.outputs.has_notes == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CICD__RELEASE_TOKEN }}
          CICD__VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh label create "autorelease: tagged" \
            --color ededed \
            --description "Release Please release has been tagged" \
            >/dev/null 2>&1 || true

          mapfile -t pending_prs < <(
            gh pr list \
              --state all \
              --label "autorelease: pending" \
              --json number,title,mergedAt \
              --jq ".[] | select(.mergedAt != null and (.title | contains(\"release $CICD__VERSION\"))) | .number"
          )

          if [ "${#pending_prs[@]}" -eq 0 ]; then
            echo "No pending Release Please PR found for $CICD__VERSION."
            exit 0
          fi

          for release_pr in "${pending_prs[@]}"; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$release_pr/labels/autorelease:%20pending" >/dev/null
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$release_pr/labels" \
              -F "labels[]=autorelease: tagged" \
              >/dev/null
            echo "Marked Release Please PR #$release_pr as tagged."
          done
