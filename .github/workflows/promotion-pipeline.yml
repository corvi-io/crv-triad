name: Promotion Pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: promotion-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  promotion-pipeline:
    name: Promotion Pipeline
    runs-on: ubuntu-latest
    env:
      CICD__BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CICD__HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: CI Configuration Tests
        run: bun run test:ci

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Sync API dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Detect affected apps
        id: affected
        run: bash .github/scripts/detect-affected-apps.sh

      - name: API Quality Gate
        if: ${{ steps.affected.outputs.api == 'true' }}
        run: bash .github/scripts/run-quality-gate.sh api

      - name: IDP Quality Gate
        if: ${{ steps.affected.outputs.idp == 'true' }}
        run: bash .github/scripts/run-quality-gate.sh idp

      - name: Site Quality Gate
        if: ${{ steps.affected.outputs.site == 'true' }}
        run: bash .github/scripts/run-quality-gate.sh site

      - name: Studio Quality Gate
        if: ${{ steps.affected.outputs.studio == 'true' }}
        run: bash .github/scripts/run-quality-gate.sh studio

      - name: Security Gate
        run: bash .github/scripts/run-security-gate.sh
