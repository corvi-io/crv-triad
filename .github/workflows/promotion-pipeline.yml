name: Promotion Pipeline
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
concurrency:
  group: promotion-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
jobs:
  delivery:
    uses: ./.github/workflows/reusable-delivery.yml
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}
      deploy: false
      environment: prd
      head-sha: ${{ github.event.pull_request.head.sha }}
      target: prd
  required-check:
    name: Promotion Pipeline
    if: ${{ always() }}
    needs: delivery
    runs-on: ubuntu-latest
    steps:
      - name: Confirm delivery result
        env:
          DELIVERY_RESULT: ${{ needs.delivery.result }}
        run: test "$DELIVERY_RESULT" = "success"
