name: Reusable Delivery
on:
  workflow_call:
    inputs:
      base-sha: { required: true, type: string }
      deploy: { required: true, type: boolean }
      environment: { required: true, type: string }
      head-sha: { required: true, type: string }
      target: { required: true, type: string }
    outputs:
      api-deployed:
        description: Whether the API was deployed.
        value: ${{ jobs.api.outputs.deployed }}
      site-deployed:
        description: Whether the site was deployed.
        value: ${{ jobs.site.outputs.deployed }}
      studio-deployed:
        description: Whether Studio was deployed.
        value: ${{ jobs.studio.outputs.deployed }}
      backstage-deployed:
        description: Whether Backstage was deployed.
        value: ${{ jobs.backstage.outputs.deployed }}
permissions:
  contents: read
jobs:
  detect:
    name: Detect affected apps
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.affected.outputs.api }}
      site: ${{ steps.affected.outputs.site }}
      studio: ${{ steps.affected.outputs.studio }}
      backstage: ${{ steps.affected.outputs.backstage }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Detect affected apps
        id: affected
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
        run: bash .github/scripts/detect-affected-apps.sh
  security:
    name: Security gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: CI configuration tests
        run: bun run test:ci
      - name: Security gate
        run: bash .github/scripts/run-security-gate.sh
  api:
    name: API delivery
    needs: [detect, security]
    if: ${{ needs.detect.outputs.api == 'true' }}
    permissions: { contents: read, id-token: write }
    uses: ./.github/workflows/reusable-app-delivery.yml
    with: { app: api, deploy: "${{ inputs.deploy }}", environment: "${{ inputs.environment }}", target: "${{ inputs.target }}" }
  site:
    name: Site delivery
    needs: [detect, security]
    if: ${{ needs.detect.outputs.site == 'true' }}
    permissions: { contents: read, id-token: write }
    uses: ./.github/workflows/reusable-app-delivery.yml
    with: { app: site, deploy: "${{ inputs.deploy }}", environment: "${{ inputs.environment }}", target: "${{ inputs.target }}" }
  studio:
    name: Studio delivery
    needs: [detect, security]
    if: ${{ needs.detect.outputs.studio == 'true' }}
    permissions: { contents: read, id-token: write }
    uses: ./.github/workflows/reusable-app-delivery.yml
    with: { app: studio, deploy: "${{ inputs.deploy }}", environment: "${{ inputs.environment }}", target: "${{ inputs.target }}" }
  backstage:
    name: Backstage delivery
    needs: [detect, security]
    if: ${{ needs.detect.outputs.backstage == 'true' }}
    permissions: { contents: read, id-token: write }
    uses: ./.github/workflows/reusable-app-delivery.yml
    # Backstage quality remains required, but deployment stays disabled until its hosting is provisioned.
    with: { app: backstage, deploy: false, environment: "${{ inputs.environment }}", target: "${{ inputs.target }}" }
