name: Develop Pipeline

on:
  pull_request:
    branches: [staging]
    types: [opened, reopened, synchronize]

concurrency:
  group: develop-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  develop-pipeline:
    name: Develop Pipeline
    runs-on: ubuntu-latest
    environment: dev
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE__CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.SITE__CLOUDFLARE_PAGES_PROJECT_NAME }}
      WEB__CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.WEB__CLOUDFLARE_PAGES_PROJECT_NAME }}
      WEB__CLOUDFLARE_PAGES_URL: ${{ vars.WEB__CLOUDFLARE_PAGES_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync API dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Detect affected apps
        id: affected
        run: bash .github/scripts/detect-affected-apps.sh

      - name: API Quality Gate
        if: ${{ steps.affected.outputs.api == 'true' }}
        run: bash .github/scripts/run-quality-gate.sh api

      - name: IDP Quality Gate
        if: ${{ steps.affected.outputs.idp == 'true' }}
        run: bash .github/scripts/run-quality-gate.sh idp

      - name: Export Site Build Env
        if: ${{ steps.affected.outputs.site == 'true' }}
        env:
          SITE__PUBLIC_SITE_URL: ${{ vars.SITE__PUBLIC_SITE_URL }}
        run: bun .github/scripts/env-management.ts export --app site --target dev --github-env "$GITHUB_ENV"

      - name: Site Quality Gate
        if: ${{ steps.affected.outputs.site == 'true' }}
        run: bash .github/scripts/run-quality-gate.sh site

      - name: Export Web Build Env
        if: ${{ steps.affected.outputs.web == 'true' }}
        env:
          WEB__VITE_AUTH_BASE_URL: ${{ vars.WEB__VITE_AUTH_BASE_URL }}
          WEB__VITE_API_BASE_URL: ${{ vars.WEB__VITE_API_BASE_URL }}
        run: bun .github/scripts/env-management.ts export --app web --target dev --github-env "$GITHUB_ENV"

      - name: Web Quality Gate
        if: ${{ steps.affected.outputs.web == 'true' }}
        run: bash .github/scripts/run-quality-gate.sh web

      - name: Security Gate
        run: bash .github/scripts/run-security-gate.sh

      - name: Set up flyctl
        if: ${{ steps.affected.outputs.api == 'true' || steps.affected.outputs.idp == 'true' }}
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: API Deploy Gate
        if: ${{ steps.affected.outputs.api == 'true' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          API__DATABASE_URL: ${{ secrets.API__DATABASE_URL }}
          API__IDP_BASE_URL: ${{ vars.API__IDP_BASE_URL }}
        run: bash .github/scripts/run-deploy-gate.sh dev api

      - name: IDP Deploy Gate
        if: ${{ steps.affected.outputs.idp == 'true' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IDP__DATABASE_URL: ${{ secrets.IDP__DATABASE_URL }}
          IDP__BETTER_AUTH_SECRET: ${{ secrets.IDP__BETTER_AUTH_SECRET }}
          IDP__APP_ENV: ${{ vars.IDP__APP_ENV }}
          IDP__BETTER_AUTH_URL: ${{ vars.IDP__BETTER_AUTH_URL }}
          IDP__AUTH_TRUSTED_ORIGINS: ${{ vars.IDP__AUTH_TRUSTED_ORIGINS }}
        run: bash .github/scripts/run-deploy-gate.sh dev idp

      - name: Site Deploy Gate
        if: ${{ steps.affected.outputs.site == 'true' }}
        env:
          SITE__PUBLIC_SITE_URL: ${{ vars.SITE__PUBLIC_SITE_URL }}
        run: bash .github/scripts/run-deploy-gate.sh dev site

      - name: Web Deploy Gate
        if: ${{ steps.affected.outputs.web == 'true' }}
        env:
          WEB__VITE_AUTH_BASE_URL: ${{ vars.WEB__VITE_AUTH_BASE_URL }}
          WEB__VITE_API_BASE_URL: ${{ vars.WEB__VITE_API_BASE_URL }}
        run: bash .github/scripts/run-deploy-gate.sh dev web

      - name: Comment Dev Deploy
        if: ${{ steps.affected.outputs.api == 'true' || steps.affected.outputs.idp == 'true' || steps.affected.outputs.site == 'true' || steps.affected.outputs.web == 'true' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          ENV_CODE: DEV
          ENV_NAME: DEVELOPMENT
          API_DEPLOYED: ${{ steps.affected.outputs.api }}
          API_URL: https://crv-triad-api-dev.fly.dev
          HEALTH_URL: https://crv-triad-api-dev.fly.dev/health
          IDP_DEPLOYED: ${{ steps.affected.outputs.idp }}
          IDP_URL: https://crv-triad-idp-dev.fly.dev
          IDP_HEALTH_URL: https://crv-triad-idp-dev.fly.dev/health
          SITE_DEPLOYED: ${{ steps.affected.outputs.site }}
          SITE_URL: ${{ vars.SITE__PUBLIC_SITE_URL }}
          WEB_DEPLOYED: ${{ steps.affected.outputs.web }}
          WEB_URL: ${{ vars.WEB__CLOUDFLARE_PAGES_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/scripts/comment-pr-api-deploy.py
