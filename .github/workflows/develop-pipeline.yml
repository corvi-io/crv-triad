name: Develop Pipeline

on:
  pull_request:
    branches: [staging]
    types: [opened, reopened, synchronize]

concurrency:
  group: develop-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  develop-pipeline:
    name: Develop Pipeline
    runs-on: ubuntu-latest
    environment: dev
    env:
      CICD__BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CICD__HEAD_SHA: ${{ github.sha }}
      CICD__DEPLOY_ENABLED: ${{ vars.CICD__DEPLOY_ENABLED }}
      INFRA__FLY_API_TOKEN: ${{ secrets.INFRA__FLY_API_TOKEN }}
      INFRA__CLOUDFLARE_API_TOKEN: ${{ secrets.INFRA__CLOUDFLARE_API_TOKEN }}
      INFRA__CLOUDFLARE_ACCOUNT_ID: ${{ vars.INFRA__CLOUDFLARE_ACCOUNT_ID }}
      INFRA__CLOUDFLARE_SITE_PROJECT_NAME: ${{ vars.INFRA__CLOUDFLARE_SITE_PROJECT_NAME }}
      INFRA__CLOUDFLARE_WEB_PROJECT_NAME: ${{ vars.INFRA__CLOUDFLARE_WEB_PROJECT_NAME }}
      INFRA__WEB_URL: ${{ vars.INFRA__WEB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: CI Configuration Tests
        run: bun run test:ci

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Sync API dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Detect affected apps
        id: affected
        run: bash .github/scripts/detect-affected-apps.sh

      - name: API Quality Gate
        if: ${{ steps.affected.outputs.api == 'true' }}
        run: bash .github/scripts/run-quality-gate.sh api

      - name: IDP Quality Gate
        if: ${{ steps.affected.outputs.idp == 'true' }}
        run: bash .github/scripts/run-quality-gate.sh idp

      - name: Export Site Build Env
        if: ${{ steps.affected.outputs.site == 'true' && env.CICD__DEPLOY_ENABLED == 'true' }}
        env:
          SITE__PUBLIC_SITE_URL: ${{ vars.SITE__PUBLIC_SITE_URL }}
        run: bun .github/scripts/env-management.ts export --app site --target dev --github-env "$GITHUB_ENV"

      - name: Site Quality Gate
        if: ${{ steps.affected.outputs.site == 'true' }}
        run: bash .github/scripts/run-quality-gate.sh site

      - name: Export Web Build Env
        if: ${{ steps.affected.outputs.web == 'true' && env.CICD__DEPLOY_ENABLED == 'true' }}
        env:
          WEB__VITE_AUTH_BASE_URL: ${{ vars.WEB__VITE_AUTH_BASE_URL }}
          WEB__VITE_API_BASE_URL: ${{ vars.WEB__VITE_API_BASE_URL }}
        run: bun .github/scripts/env-management.ts export --app web --target dev --github-env "$GITHUB_ENV"

      - name: Web Quality Gate
        if: ${{ steps.affected.outputs.web == 'true' }}
        run: bash .github/scripts/run-quality-gate.sh web

      - name: Security Gate
        run: bash .github/scripts/run-security-gate.sh

      - name: Set up flyctl
        if: ${{ env.CICD__DEPLOY_ENABLED == 'true' && (steps.affected.outputs.api == 'true' || steps.affected.outputs.idp == 'true') }}
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - name: API Deploy Gate
        if: ${{ steps.affected.outputs.api == 'true' && env.CICD__DEPLOY_ENABLED == 'true' }}
        env:
          API__DATABASE_URL: ${{ secrets.API__DATABASE_URL }}
          API__IDP_BASE_URL: ${{ vars.API__IDP_BASE_URL }}
        run: bash .github/scripts/run-deploy-gate.sh dev api

      - name: IDP Deploy Gate
        if: ${{ steps.affected.outputs.idp == 'true' && env.CICD__DEPLOY_ENABLED == 'true' }}
        env:
          IDP__DATABASE_URL: ${{ secrets.IDP__DATABASE_URL }}
          IDP__BETTER_AUTH_SECRET: ${{ secrets.IDP__BETTER_AUTH_SECRET }}
          IDP__APP_ENV: ${{ vars.IDP__APP_ENV }}
          IDP__BETTER_AUTH_URL: ${{ vars.IDP__BETTER_AUTH_URL }}
          IDP__AUTH_TRUSTED_ORIGINS: ${{ vars.IDP__AUTH_TRUSTED_ORIGINS }}
        run: bash .github/scripts/run-deploy-gate.sh dev idp

      - name: Site Deploy Gate
        if: ${{ steps.affected.outputs.site == 'true' && env.CICD__DEPLOY_ENABLED == 'true' }}
        env:
          SITE__PUBLIC_SITE_URL: ${{ vars.SITE__PUBLIC_SITE_URL }}
        run: bash .github/scripts/run-deploy-gate.sh dev site

      - name: Web Deploy Gate
        if: ${{ steps.affected.outputs.web == 'true' && env.CICD__DEPLOY_ENABLED == 'true' }}
        env:
          WEB__VITE_AUTH_BASE_URL: ${{ vars.WEB__VITE_AUTH_BASE_URL }}
          WEB__VITE_API_BASE_URL: ${{ vars.WEB__VITE_API_BASE_URL }}
        run: bash .github/scripts/run-deploy-gate.sh dev web

      - name: Comment Dev Deploy
        if: ${{ env.CICD__DEPLOY_ENABLED == 'true' && (steps.affected.outputs.api == 'true' || steps.affected.outputs.idp == 'true' || steps.affected.outputs.site == 'true' || steps.affected.outputs.web == 'true') }}
        continue-on-error: true
        env:
          CICD__GITHUB_TOKEN: ${{ github.token }}
          CICD__PR_NUMBER: ${{ github.event.pull_request.number }}
          CICD__COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          CICD__ENV_CODE: DEV
          CICD__ENV_NAME: DEVELOPMENT
          CICD__API_DEPLOYED: ${{ steps.affected.outputs.api }}
          CICD__API_URL: https://crv-triad-api-dev.fly.dev
          CICD__API_HEALTH_URL: https://crv-triad-api-dev.fly.dev/health
          CICD__IDP_DEPLOYED: ${{ steps.affected.outputs.idp }}
          CICD__IDP_URL: https://crv-triad-idp-dev.fly.dev
          CICD__IDP_HEALTH_URL: https://crv-triad-idp-dev.fly.dev/health
          CICD__SITE_DEPLOYED: ${{ steps.affected.outputs.site }}
          CICD__SITE_URL: ${{ vars.SITE__PUBLIC_SITE_URL }}
          CICD__WEB_DEPLOYED: ${{ steps.affected.outputs.web }}
          CICD__WEB_URL: ${{ vars.INFRA__WEB_URL }}
          CICD__RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/scripts/comment-pr-api-deploy.py
