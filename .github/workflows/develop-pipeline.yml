name: Develop Pipeline
on:
  pull_request:
    branches: [staging]
    types: [opened, reopened, synchronize, ready_for_review]
concurrency:
  group: develop-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write
jobs:
  delivery:
    uses: ./.github/workflows/reusable-delivery.yml
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}
      comment-deploy: true
      deploy: true
      environment: dev
      head-sha: ${{ github.event.pull_request.head.sha }}
      target: dev
  required-check:
    name: Develop Pipeline
    if: ${{ always() }}
    needs: delivery
    runs-on: ubuntu-latest
    steps:
      - name: Confirm delivery result
        env:
          DELIVERY_RESULT: ${{ needs.delivery.result }}
        run: test "$DELIVERY_RESULT" = "success"
