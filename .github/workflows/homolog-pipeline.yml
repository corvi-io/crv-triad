name: Homolog Pipeline
on:
  push:
    branches: [staging]
concurrency:
  group: homolog-pipeline
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
jobs:
  delivery:
    uses: ./.github/workflows/reusable-delivery.yml
    with:
      base-sha: ${{ github.event.before }}
      deploy: true
      environment: hml
      head-sha: ${{ github.sha }}
      target: hml
  required-check:
    name: Homolog Pipeline
    if: ${{ always() }}
    needs: delivery
    runs-on: ubuntu-latest
    steps:
      - name: Confirm delivery result
        env:
          DELIVERY_RESULT: ${{ needs.delivery.result }}
        run: test "$DELIVERY_RESULT" = "success"
