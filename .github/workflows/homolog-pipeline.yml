name: Homolog Pipeline

on:
  push:
    branches: [staging]

concurrency:
  group: homolog-pipeline
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  homolog-pipeline:
    name: Homolog Pipeline
    runs-on: ubuntu-latest
    environment: hml
    env:
      BASE_SHA: ${{ github.event.before }}
      HEAD_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE__CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.SITE__CLOUDFLARE_PAGES_PROJECT_NAME }}
      WEB__CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.WEB__CLOUDFLARE_PAGES_PROJECT_NAME }}
      WEB__CLOUDFLARE_PAGES_URL: ${{ vars.WEB__CLOUDFLARE_PAGES_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync API dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Detect affected apps
        id: affected
        run: bash .github/scripts/detect-affected-apps.sh

      - name: API Quality Gate
        if: ${{ steps.affected.outputs.api == 'true' }}
        run: bash .github/scripts/run-quality-gate.sh api

      - name: IDP Quality Gate
        if: ${{ steps.affected.outputs.idp == 'true' }}
        run: bash .github/scripts/run-quality-gate.sh idp

      - name: Export Site Build Env
        if: ${{ steps.affected.outputs.site == 'true' }}
        env:
          SITE__PUBLIC_SITE_URL: ${{ vars.SITE__PUBLIC_SITE_URL }}
        run: bun .github/scripts/env-management.ts export --app site --target hml --github-env "$GITHUB_ENV"

      - name: Site Quality Gate
        if: ${{ steps.affected.outputs.site == 'true' }}
        run: bash .github/scripts/run-quality-gate.sh site

      - name: Export Web Build Env
        if: ${{ steps.affected.outputs.web == 'true' }}
        env:
          WEB__VITE_AUTH_BASE_URL: ${{ vars.WEB__VITE_AUTH_BASE_URL }}
          WEB__VITE_API_BASE_URL: ${{ vars.WEB__VITE_API_BASE_URL }}
        run: bun .github/scripts/env-management.ts export --app web --target hml --github-env "$GITHUB_ENV"

      - name: Web Quality Gate
        if: ${{ steps.affected.outputs.web == 'true' }}
        run: bash .github/scripts/run-quality-gate.sh web

      - name: Security Gate
        run: bash .github/scripts/run-security-gate.sh

      - name: Set up flyctl
        if: ${{ steps.affected.outputs.api == 'true' || steps.affected.outputs.idp == 'true' }}
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: API Deploy Gate
        if: ${{ steps.affected.outputs.api == 'true' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          API__DATABASE_URL: ${{ secrets.API__DATABASE_URL }}
          API__IDP_BASE_URL: ${{ vars.API__IDP_BASE_URL }}
        run: bash .github/scripts/run-deploy-gate.sh hml api

      - name: IDP Deploy Gate
        if: ${{ steps.affected.outputs.idp == 'true' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IDP__DATABASE_URL: ${{ secrets.IDP__DATABASE_URL }}
          IDP__BETTER_AUTH_SECRET: ${{ secrets.IDP__BETTER_AUTH_SECRET }}
          IDP__APP_ENV: ${{ vars.IDP__APP_ENV }}
          IDP__BETTER_AUTH_URL: ${{ vars.IDP__BETTER_AUTH_URL }}
          IDP__AUTH_TRUSTED_ORIGINS: ${{ vars.IDP__AUTH_TRUSTED_ORIGINS }}
        run: bash .github/scripts/run-deploy-gate.sh hml idp

      - name: Site Deploy Gate
        if: ${{ steps.affected.outputs.site == 'true' }}
        env:
          SITE__PUBLIC_SITE_URL: ${{ vars.SITE__PUBLIC_SITE_URL }}
        run: bash .github/scripts/run-deploy-gate.sh hml site

      - name: Web Deploy Gate
        if: ${{ steps.affected.outputs.web == 'true' }}
        env:
          WEB__VITE_AUTH_BASE_URL: ${{ vars.WEB__VITE_AUTH_BASE_URL }}
          WEB__VITE_API_BASE_URL: ${{ vars.WEB__VITE_API_BASE_URL }}
        run: bash .github/scripts/run-deploy-gate.sh hml web
