name: Load Infisical Secrets
description: Authenticate through GitHub OIDC and load one Infisical secret path.
inputs:
  environment:
    description: Infisical environment slug.
    required: true
  identity-id:
    description: Infisical machine identity ID configured for GitHub OIDC.
    required: true
  project-slug:
    description: Infisical project slug.
    required: true
  secret-path:
    description: Infisical secret folder path.
    required: true
runs:
  using: composite
  steps:
    - name: Load secrets
      uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.9
      with:
        method: oidc
        identity-id: ${{ inputs.identity-id }}
        project-slug: ${{ inputs.project-slug }}
        env-slug: ${{ inputs.environment }}
        secret-path: ${{ inputs.secret-path }}
